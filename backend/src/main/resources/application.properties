# =============================================================================
#  EVERY SETTING HERE HAS AN ENVIRONMENT-VARIABLE OVERRIDE
# =============================================================================
#  The pattern is ${SOME_VAR:default}: use SOME_VAR if it is set, otherwise the
#  value after the colon. The defaults describe a laptop — HTTPS on 8443, an H2
#  file, an admin/admin login — and the overrides describe the deployed copy.
#
#  This is why there is no "prod" profile to remember to activate. The same jar
#  runs in both places; the environment is the only difference. A build that
#  cannot accidentally be deployed with the wrong profile is one whole class of
#  outage that cannot happen.
#
#  Spring maps the variable names automatically: app.session.ttl-minutes is
#  settable as APP_SESSION_TTL_MINUTES, and so on. The explicit ${...} below is
#  only needed where the variable name differs from that pattern.
# =============================================================================

# =============================================================================
#  Server
# =============================================================================
# 8443 is the conventional "https" port for a development server, the same way
# 8080 is the conventional "http" one. Hosting platforms (Render, Railway, Fly)
# inject the port they want you on as PORT, so read that when it is present.
server.port=${PORT:8443}

# -----------------------------------------------------------------------------
#  TLS
# -----------------------------------------------------------------------------
# Locally the app terminates TLS itself, using a self-signed certificate in a
# PKCS12 keystore on the classpath (src/main/resources/keystore.p12).
#
# That file is NOT in git, and you have to create it once before the app will
# start. From the backend/ folder:
#
#   keytool -genkeypair -alias cookiedemo -keyalg RSA -keysize 2048 \
#           -storetype PKCS12 -keystore src/main/resources/keystore.p12 \
#           -validity 365 -storepass changeit \
#           -dname "CN=localhost, OU=Dev, O=CookieShookie, L=., ST=., C=IN" \
#           -ext "SAN=dns:localhost,ip:127.0.0.1"
#
# (There is a ready-made script: backend/make-keystore.cmd)
#
# The certificate is self-signed, so browsers will show a warning the first
# time — that is correct behaviour, not a bug. A self-signed certificate proves
# the traffic is encrypted but proves nothing about WHO you are talking to.
#
# IN PRODUCTION THIS IS TURNED OFF, and that is not a downgrade. Set
# SERVER_SSL_ENABLED=false when deploying behind a platform load balancer: the
# browser's connection to the platform is real, CA-signed HTTPS, and the
# platform speaks plain HTTP to this process over its own internal network.
# Terminating TLS at the edge is how essentially every deployed app works, and
# it is why the app itself no longer needs a certificate.
server.ssl.enabled=${SERVER_SSL_ENABLED:true}
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=cookiedemo

# Overridable so the password never has to be a literal in a real deployment:
#   set KEYSTORE_PASSWORD=... before starting
server.ssl.key-store-password=${KEYSTORE_PASSWORD:changeit}

# Refuse the old, broken versions of TLS. 1.2 is the floor; 1.3 is preferred.
server.ssl.enabled-protocols=TLSv1.3,TLSv1.2

# Behind a load balancer, the request Tomcat sees arrives over plain http from
# an internal address. This makes Spring read X-Forwarded-Proto / -For instead,
# so the app knows the BROWSER's connection was https. Without it, anything
# that reasons about the scheme (redirects, absolute URLs, isSecure checks) is
# working from the wrong answer.
server.forward-headers-strategy=framework

# =============================================================================
#  Cookies — shared hardening for both of them
# =============================================================================
# These two govern the session cookie AND the device cookie, via CookieFactory.
#
# Secure -> the browser only ever sends them over HTTPS. Set to false ONLY if
# you are deliberately running the backend on plain http to debug something.
app.cookie.secure=${APP_COOKIE_SECURE:true}

# Lax    -> not attached to requests another website fires at us (anti-CSRF)
# Strict -> also dropped when you follow a link in from another site
# None   -> sent everywhere; requires Secure, and is only needed if the page and
#           the API are genuinely on different hostnames. Keeping them on one
#           origin (dev proxy / Vercel rewrite) is much the better answer.
app.cookie.same-site=${APP_COOKIE_SAME_SITE:Lax}

# -----------------------------------------------------------------------------
#  The session cookie: WHO is signed in
# -----------------------------------------------------------------------------
# The name you will see in DevTools. Nothing about it hints at what is inside,
# because nothing IS inside — it is a random id.
app.session.cookie-name=sid

# Lifetime of a session, in MINUTES. 43200 = 30 days.
#
# Minutes rather than days so the expiry is actually demonstrable — "days" is
# too coarse a unit to ever watch a session die. To see it happen, start the
# backend with a one-minute lifetime and leave this file alone:
#
#   mvnw.cmd spring-boot:run "-Dspring-boot.run.arguments=--app.session.ttl-minutes=1"
app.session.ttl-minutes=${APP_SESSION_TTL_MINUTES:43200}

# -----------------------------------------------------------------------------
#  The device cookie: WHICH workstation this browser is
# -----------------------------------------------------------------------------
# "did" — device id. Deliberately as uninformative a name as "sid".
app.device.cookie-name=did

# 3650 days is ten years: the closest a cookie can get to "permanent", which is
# what the binding is meant to be. Browsers cap the real lifetime near 400 days
# regardless, which is why AuthController re-sends this cookie with a fresh
# deadline on every successful login. A browser in weekly use never expires.
app.device.cookie-max-age-days=${APP_DEVICE_COOKIE_MAX_AGE_DAYS:3650}

# =============================================================================
#  The bootstrap administrator
# =============================================================================
# Someone has to be able to reset a locked-out worker, and /api/register can
# only ever create workers — deliberately, so that no request from outside can
# mint an administrator. This account is created on first startup if it is
# missing, and an existing account with this username is promoted to ADMIN.
#
# An existing account's PASSWORD is never overwritten. Change the password
# through the database, not by editing this and restarting.
#
# CHANGE THESE BEFORE DEPLOYING. Set username to blank to disable entirely.
app.bootstrap.admin.username=${APP_BOOTSTRAP_ADMIN_USERNAME:admin}
app.bootstrap.admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:admin}
app.bootstrap.admin.full-name=${APP_BOOTSTRAP_ADMIN_FULL_NAME:Administrator}
app.bootstrap.admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:admin@example.com}

# =============================================================================
#  CORS — leave blank
# =============================================================================
# Only needed if the frontend is served from a different hostname than this
# API. See WebConfig for why arranging same-origin is worth the small effort
# instead. If you do set this, set app.cookie.same-site=None as well.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}

# =============================================================================
#  Database
# =============================================================================
#  Local default: H2 as a file inside ./data, so accounts survive restarts and
#  nothing has to be installed.
#
#  Deployed: Neon (managed Postgres). Set SPRING_DATASOURCE_URL to a JDBC URL —
#  note JDBC form, not the psql:// form Neon shows you first:
#
#    jdbc:postgresql://ep-xxx-123456.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
#
#  ...with the username and password in their own variables below. sslmode=require
#  is not optional with Neon; the connection is over the public internet.
#
#  There is no driverClassName line any more, on purpose. Spring infers the
#  driver from the URL, so naming it would be a second place to keep in sync and
#  a way to end up asking H2 to open a Postgres connection.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/cookiedemo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Neon puts idle databases to sleep and closes pooled connections underneath
# you. These keep Hikari from handing out a socket that died while nobody was
# looking — the classic "works, then throws once after lunch" symptom.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.connection-timeout=30000

# Automatically create/update the tables from our Java classes.
#
# Fine for a demo, and the reason both new columns on APP_USER carry an explicit
# DEFAULT: `update` has to add them to a table that already has rows, and a NOT
# NULL column can only be added to a populated table if it has one.
#
# A real production service would use Flyway or Liquibase instead, so that
# schema changes are reviewed files rather than something Hibernate infers at
# startup and applies to the live database on its own.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

# Silences a harmless startup warning about queries running during page rendering.
spring.jpa.open-in-view=false

# Optional: open https://localhost:8443/h2-console to SEE the tables with your
# own eyes — APP_USER and USER_SESSION.
# (JDBC URL to type there: jdbc:h2:file:./data/cookiedemo   user: sa   password: blank)
#
# Set H2_CONSOLE_ENABLED=false when deploying — and note it does nothing at all
# against Postgres anyway. A database console reachable over the network is
# exactly the kind of door you do not want left open.
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
