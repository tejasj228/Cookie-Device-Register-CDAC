# =============================================================================
#  Settings used ONLY when the tests run.
#
#  Spring loads this file instead of src/main/resources/application.properties,
#  which matters for two reasons:
#
#   1. Tests must never touch ./data/cookiedemo — running them would otherwise
#      churn your demo accounts. Each test run gets a fresh in-memory database
#      that disappears when the JVM exits.
#
#   2. MockMvc does not start a real network server, so there is no TLS handshake
#      to configure and no keystore to load. Turning SSL off here means the test
#      suite still runs on a machine where nobody has generated a certificate.
#
#  Note that app.session.cookie-secure stays TRUE. Whether the Secure attribute
#  is written onto the header is precisely what the test asserts, so it has to
#  be on.
# =============================================================================

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

server.ssl.enabled=false
spring.h2.console.enabled=false

# Whether Secure lands on the header is precisely what the suite asserts, so it
# stays on even though nothing here speaks TLS.
app.cookie.secure=true
app.cookie.same-site=Lax

app.session.cookie-name=sid
app.session.ttl-minutes=43200

app.device.cookie-name=did
app.device.cookie-max-age-days=3650

# No bootstrap administrator during tests.
#
# Not because it would break anything, but because a row that appears without
# any test asking for it is a row every later assertion has to remember to
# account for — users.count() being 1 when the test created 0 is a confusing
# half-hour. DeviceBindingTest creates the admin it needs, explicitly.
app.bootstrap.admin.username=

app.cors.allowed-origins=
